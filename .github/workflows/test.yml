name: Unit tests

# Host-side unit tests. Runs on every branch push and pull request; separate
# from build-and-deploy.yml, so it never publishes anything.
on:
  push:
    branches: [ '**' ]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build BMW PHEV protocol test
        run: g++ -std=c++11 -Wall -Wextra -Isrc test/phev_protocol_test.cpp -o phev_protocol_test

      - name: Run BMW PHEV protocol test
        run: ./phev_protocol_test
